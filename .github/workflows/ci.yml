name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate the pinned environment
        run: nix flake check --no-write-lock-file
      - name: Build the projector and run its proof audit
        run: |
          nix develop --no-write-lock-file --command bash -euo pipefail -c '
            lake update ayxg wruh
            lake exe cache get
            lake build UtemReborn
            lake env lean -DwarningAsError=true tests/ProofAudit.lean
          '
