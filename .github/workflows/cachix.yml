name: Cachix publication

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            accept-flake-config = true
      - name: Use HTTPS for public GitHub flake inputs
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Require Cachix write token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::CACHIX_AUTH_TOKEN is required to publish the UTEM cache.'
            exit 1
          fi
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: utem
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build the pinned UTEM development shell
        run: nix develop --no-write-lock-file --command true
